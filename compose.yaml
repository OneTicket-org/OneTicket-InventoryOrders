services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: inventoryorders
      POSTGRES_PASSWORD: inventoryorders-dev-secret
      POSTGRES_DB: inventoryorders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryorders -d inventoryorders"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventoryorders:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inventoryorders:inventoryorders-dev-secret@db:5432/inventoryorders
      RUST_LOG: info
    ports:
      - "3000:3000"

volumes:
  pgdata:
